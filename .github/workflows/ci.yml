name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-and-test:
    name: go vet and go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the Go toolchain declared in go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # go test ./... also runs pkg/parser's golden corpus test
      # (TestGoldenCorpus), which pins the parse output of the real titles in
      # pkg/parser/testdata, and the serve protocol tests.
      - name: go test
        run: go test ./...

  publish-test-channel:
    name: publish the test channel
    # Every main push becomes a test-channel release, the same way the consumer
    # (bansoko) ships test builds from main. Pull requests never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: vet-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Go toolchain declared in go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build both architectures
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
          core="${last_tag#v}"
          IFS=. read -r major minor patch <<< "$core"
          version="$major.$minor.$((patch + 1))-test.${{ github.run_number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "LINE=$major.$minor" >> "$GITHUB_ENV"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/reltitle-linux-$arch" ./cmd/reltitle
          done
          ./dist/reltitle-linux-amd64 -version

      - name: Build the test channel
        run: |
          set -euo pipefail
          previous="$(mktemp)"
          args=()
          if git fetch --depth=1 origin update-channel-test >/dev/null 2>&1 &&
             git show "FETCH_HEAD:lines/$LINE/channel.json" > "$previous"; then
            args=(--manifest "$previous")
          fi
          sequence="$(go run ./cmd/reltitle-release next-sequence "${args[@]}")"
          go run ./cmd/reltitle-release channel \
            --line "$LINE" \
            --version "$VERSION" \
            --sequence "$sequence" \
            --release-url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --artifact "linux/amd64=dist/reltitle-linux-amd64" \
            --artifact "linux/arm64=dist/reltitle-linux-arm64" \
            --out channel
          go run ./cmd/reltitle-release verify \
            --manifest "channel/lines/$LINE/channel.json"

      - name: Publish the test channel
        run: |
          set -euo pipefail
          scripts/publish-channel.sh update-channel-test channel "$VERSION" \
            "channel(test): publish $VERSION"
