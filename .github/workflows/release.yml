name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: go vet and go test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the Go toolchain declared in go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  release:
    name: create the GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Extract the CHANGELOG section for this tag
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$notes_file"
          printf 'NOTES_FILE=%s\n' "$notes_file" >> "$GITHUB_ENV"
          printf -- '--- release notes for %s ---\n' "$GITHUB_REF_NAME"
          cat "$notes_file"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE"
