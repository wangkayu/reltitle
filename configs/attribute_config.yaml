updated_at: "2025-01-17"
description: "统一字段配置 - 配置驱动的Parser架构"

# ============================================================================
# 字段定义 (Field Definitions)
# ============================================================================

fields:
  # --------------------------------------------------------------------------
  # Core Fields - 核心字段
  # --------------------------------------------------------------------------
  
  raw_title:
    category: core
    type: string
    required: true
    business_priority: P0
    description: "原始标题,不做任何处理"
    business_use:
      - "审计和调试"
      - "重新解析"
    extraction:
      source: input
    validation:
      min_length: 1
      max_length: 1000
  
  group:
    category: core
    type: string
    required: false
    business_priority: P1
    description: "发布组名称"
    business_use:
      - "RSS匹配的分组"
      - "用户偏好过滤"
      - "Rerank权重"
    extraction:
      source: leading_bracket
      method: whitelist_validation
    validation:
      min_length: 1
      max_length: 50
    standardization:
      - trim
  
  title:
    category: core
    type: string
    required: true
    business_priority: P0
    description: "干净的主标题,用于embedding匹配"
    business_use:
      - "RSS匹配的primary query"
      - "用户展示"
    quality_requirements:
      - "无分隔符残留"
      - "无技术属性噪音"
      - "单一语言版本(优先中文/日文)"
    extraction:
      source: title_slot
      post_process:
        - trim_delimiters: " /|｜\\"
        - remove_tech_noise: true
        - standardize_spaces: true
        - remove_trailing_separators: true
    validation:
      min_length: 1
      max_length: 100
      not_contains: ["[", "]", "(", ")", "{", "}", "【", "】"]
      not_ends_with: ["/", "|", "｜", "\\"]
    standardization:
      - trim
      - collapse_spaces
      - remove_trailing_separators
  
  title_variants:
    category: core
    type: array[string]
    required: false
    business_priority: P1
    description: "标题的其他语言版本,用于提高匹配召回率"
    business_use:
      - "RSS匹配的secondary queries"
      - "提高召回率"
    extraction:
      sources:
        - multi_language_split  # 从title的分隔符拆分
        - container_aliases     # 从Container提取
        - crf_multi_language    # 从CRF识别(未来)
      merge_strategy: deduplicate
    validation:
      item_min_length: 1
      item_max_length: 100
      deduplicate: true
      exclude_main_title: true
    standardization:
      - trim_each
      - deduplicate
  
  episode:
    category: core
    type: string
    required: false
    business_priority: P0
    description: "单集编号"
    business_use:
      - "文件到剧集的映射"
      - "Rerank验证"
      - "用户过滤"
    extraction:
      source: ep_slot
      fallback: inference
    validation:
      pattern: "^(\\d{1,4}|SP\\d{1,3})$"
      range_min: 1
      range_max: 9999
    standardization:
      - pad_zero: 2  # "1" → "01"
      - uppercase_sp: true  # "sp1" → "SP01"
  
  episode_range:
    category: core
    type: string
    required: false
    business_priority: P1
    description: "集数范围(batch)"
    business_use:
      - "Batch识别"
      - "Content Kind推理"
    extraction:
      source: ep_slot
      method: range_pattern
    validation:
      pattern: "^\\d{1,4}-\\d{1,4}$"
      start_less_than_end: true
    standardization:
      - pad_zero_range: 2  # "1-12" → "01-12"
  
  season:
    category: core
    type: string
    required: false
    business_priority: P2
    description: "季度编号"
    business_use:
      - "多季动画的区分"
      - "TMDB匹配"
    extraction:
      source: season_pattern
    validation:
      pattern: "^\\d{1,2}$"
      range_min: 1
      range_max: 99
    standardization:
      - pad_zero: 2  # "1" → "01"
  
  content_kind:
    category: core
    type: enum
    required: true
    business_priority: P0
    description: "内容类型"
    values:
      - TV_EP
      - MOVIE
      - OVA
      - ONA
      - SPECIAL
      - BATCH
      - UNKNOWN
    business_use:
      - "Rerank验证"
      - "用户过滤"
      - "自动化规则"
    extraction:
      source: inference
      fallback: crf_prediction  # CRF更准确(未来)
    inference_rules:
      - condition: "has_episode && !has_episode_range"
        result: TV_EP
        confidence: 0.9
      - condition: "has_episode_range"
        result: BATCH
        confidence: 0.95
      - condition: "has_movie_keyword"
        result: MOVIE
        confidence: 0.85
      - condition: "has_ova_keyword"
        result: OVA
        confidence: 0.85
      - condition: "has_ona_keyword"
        result: ONA
        confidence: 0.80
      - condition: "has_special_keyword"
        result: SPECIAL
        confidence: 0.75
      - condition: "default"
        result: UNKNOWN
        confidence: 0.5
  
  # --------------------------------------------------------------------------
  # Technical Attributes - 技术属性
  # --------------------------------------------------------------------------
  
  source_type:
    category: technical
    type: enum
    required: false
    business_priority: P1
    description: "视频来源"
    values:
      - WebRip
      - WEB-DL
      - BDRip
      - DVDRip
      - HDTV
      - Unknown
    business_use:
      - "用户质量偏好"
      - "自动化下载规则"
    extraction:
      source: tech_slot
      method: dictionary_match
    standardization:
      type: mapping
      rules:
        "WEBRIP": "WebRip"
        "webrip": "WebRip"
        "Web-Rip": "WebRip"
        "WEB-DL": "WEB-DL"
        "WEBDL": "WEB-DL"
        "webdl": "WEB-DL"
        "BDRIP": "BDRip"
        "bdrip": "BDRip"
        "BD-RIP": "BDRip"
        "DVDRIP": "DVDRip"
        "dvdrip": "DVDRip"
        "DVD-RIP": "DVDRip"
        "HDTV": "HDTV"
        "hdtv": "HDTV"
  
  resolution:
    category: technical
    type: enum
    required: false
    business_priority: P1
    description: "分辨率"
    values:
      - 2160p
      - 1080p
      - 720p
      - 480p
      - Unknown
    business_use:
      - "用户质量偏好"
      - "存储规划"
    extraction:
      source: tech_slot
      method: pattern_match
    standardization:
      type: mapping
      rules:
        "1080P": "1080p"
        "1920x1080": "1080p"
        "FHD": "1080p"
        "720P": "720p"
        "1280x720": "720p"
        "HD": "720p"
        "2160P": "2160p"
        "3840x2160": "2160p"
        "4K": "2160p"
        "UHD": "2160p"
        "480P": "480p"
        "SD": "480p"
  
  video_codec:
    category: technical
    type: enum
    required: false
    business_priority: P1
    description: "视频编码"
    values:
      - HEVC
      - AVC
      - H264
      - H265
      - VP9
      - AV1
      - Unknown
    business_use:
      - "兼容性检查"
      - "用户偏好"
    extraction:
      source: tech_slot
      method: dictionary_match
    standardization:
      type: mapping
      rules:
        "H265": "HEVC"
        "h265": "HEVC"
        "H.265": "HEVC"
        "x265": "HEVC"
        "H264": "AVC"
        "h264": "AVC"
        "H.264": "AVC"
        "x264": "AVC"
        "hevc": "HEVC"
        "avc": "AVC"
        "vp9": "VP9"
        "av1": "AV1"
  
  bit_depth:
    category: technical
    type: enum
    required: false
    business_priority: P2
    description: "位深度"
    values:
      - 10bit
      - 8bit
      - Unknown
    business_use:
      - "质量评估"
    extraction:
      source: tech_slot
      method: pattern_match
    standardization:
      type: format
      rules:
        pattern: "^(\\d+)(?:bit)?$"
        format: "{0}bit"  # "10" → "10bit"
  
  audio_codec:
    category: technical
    type: enum
    required: false
    business_priority: P2
    description: "音频编码"
    values:
      - AAC
      - FLAC
      - DTS
      - AC3
      - EAC3
      - Opus
      - MP3
      - Unknown
    business_use:
      - "兼容性检查"
    extraction:
      source: tech_slot
      method: dictionary_match
    standardization:
      type: mapping
      rules:
        "aac": "AAC"
        "flac": "FLAC"
        "dts": "DTS"
        "ac3": "AC3"
        "eac3": "EAC3"
        "opus": "Opus"
        "mp3": "MP3"
  
  # --------------------------------------------------------------------------
  # Metadata - 元数据
  # --------------------------------------------------------------------------
  
  qualified:
    category: metadata
    type: boolean
    required: true
    business_priority: P0
    description: "是否通过基本质量检查"
    business_use:
      - "过滤低质量解析"
      - "调试和监控"
    extraction:
      source: calculation
    calculation:
      formula: "has_title && (has_episode || has_movie_keyword)"
  
  confidence:
    category: metadata
    type: float
    required: false
    business_priority: P1
    description: "解析置信度 (0.0-1.0)"
    business_use:
      - "Rerank权重"
      - "人工审核优先级"
    extraction:
      source: calculation
    calculation:
      factors:
        - template_match_score: 0.4
        - field_completeness: 0.3
        - validation_pass_rate: 0.3
    validation:
      range_min: 0.0
      range_max: 1.0
  
  parser_version:
    category: metadata
    type: string
    required: true
    business_priority: P0
    description: "解析器版本"
    business_use:
      - "版本追踪"
      - "A/B测试"
    extraction:
      source: constant
      value: "v2.0.0"

# ============================================================================
# 字段组 (Field Groups) - 用于批量操作
# ============================================================================

field_groups:
  rss_matching:
    description: "RSS匹配所需的字段"
    priority: P0
    fields:
      - title
      - title_variants
      - episode
      - content_kind
      - group
  
  user_display:
    description: "用户展示所需的字段"
    priority: P1
    fields:
      - title
      - episode
      - group
      - source_type
      - resolution
      - video_codec
  
  rerank_metadata:
    description: "Rerank所需的元数据"
    priority: P0
    fields:
      - episode
      - content_kind
      - confidence
      - group
  
  technical_attributes:
    description: "所有技术属性"
    priority: P2
    fields:
      - source_type
      - resolution
      - video_codec
      - bit_depth
      - audio_codec

# ============================================================================
# 业务规则 (Business Rules)
# ============================================================================

business_rules:
  rss_matching:
    description: "RSS标题匹配规则"
    primary_query: title
    secondary_queries: title_variants
    metadata_for_rerank:
      - episode
      - content_kind
      - group
    quality_threshold:
      min_confidence: 0.7
      require_qualified: true
  
  quality_check:
    description: "基本质量检查规则"
    qualified_if:
      - has_title: true
      - any_of:
          - has_episode: true
          - has_movie_keyword: true
    disqualified_if:
      - title_too_short: true  # < 2 characters
      - title_has_brackets: true
      - title_ends_with_separator: true
  
  content_kind_inference:
    description: "内容类型推理规则"
    rules:
      - name: "TV Episode"
        condition: "has_episode && !has_episode_range && !has_movie_keyword"
        result: TV_EP
        confidence: 0.9
      - name: "Batch"
        condition: "has_episode_range"
        result: BATCH
        confidence: 0.95
      - name: "Movie"
        condition: "has_movie_keyword || (title_contains_movie_pattern && !has_episode)"
        result: MOVIE
        confidence: 0.85
      - name: "OVA"
        condition: "has_ova_keyword"
        result: OVA
        confidence: 0.85
      - name: "ONA"
        condition: "has_ona_keyword"
        result: ONA
        confidence: 0.80
      - name: "Special"
        condition: "has_special_keyword || episode_is_sp"
        result: SPECIAL
        confidence: 0.75
      - name: "Unknown"
        condition: "default"
        result: UNKNOWN
        confidence: 0.5

# ============================================================================
# 标准化规则 (Standardization Rules)
# ============================================================================

standardization:
  title:
    description: "标题清洁规则"
    steps:
      - name: "trim"
        description: "去除首尾空格"
      - name: "collapse_spaces"
        description: "合并多个空格为一个"
      - name: "remove_trailing_separators"
        description: "去除尾部分隔符"
        patterns: ["/", "|", "｜", "\\", " / ", " | "]
      - name: "remove_tech_noise"
        description: "去除技术属性噪音"
        patterns:
          - "\\b(?:1080p|720p|2160p|480p)\\b"
          - "\\b(?:WebRip|WEB-DL|BDRip|DVDRip)\\b"
          - "\\b(?:HEVC|AVC|H264|H265)\\b"
          - "\\b(?:AAC|FLAC|DTS|AC3)\\b"
  
  episode:
    description: "集数标准化规则"
    steps:
      - name: "pad_zero"
        description: "补零到2位"
        digits: 2
        examples:
          - input: "1"
            output: "01"
          - input: "12"
            output: "12"
      - name: "uppercase_sp"
        description: "SP大写"
        examples:
          - input: "sp1"
            output: "SP01"
          - input: "SP1"
            output: "SP01"
  
  source_type:
    description: "来源类型标准化"
    type: mapping
    case_insensitive: true
    rules:
      "WEBRIP": "WebRip"
      "webrip": "WebRip"
      "Web-Rip": "WebRip"
      "WEB-DL": "WEB-DL"
      "WEBDL": "WEB-DL"
      "webdl": "WEB-DL"
      "BDRIP": "BDRip"
      "bdrip": "BDRip"
      "BD-RIP": "BDRip"
  
  resolution:
    description: "分辨率标准化"
    type: mapping
    case_insensitive: true
    rules:
      "1080P": "1080p"
      "1920x1080": "1080p"
      "FHD": "1080p"
      "720P": "720p"
      "1280x720": "720p"
      "HD": "720p"
      "2160P": "2160p"
      "3840x2160": "2160p"
      "4K": "2160p"
      "UHD": "2160p"
  
  video_codec:
    description: "视频编码标准化"
    type: mapping
    case_insensitive: true
    rules:
      "H265": "HEVC"
      "h265": "HEVC"
      "H.265": "HEVC"
      "x265": "HEVC"
      "H264": "AVC"
      "h264": "AVC"
      "H.264": "AVC"
      "x264": "AVC"

# ============================================================================
# 字段依赖关系 (Field Dependencies)
# ============================================================================

dependencies:
  independent_fields:
    description: "独立字段 - 直接从raw_title提取"
    fields:
      - raw_title
      - group
      - title
      - episode
      - source_type
      - resolution
      - video_codec
      - bit_depth
      - audio_codec
  
  derived_fields:
    description: "派生字段 - 从其他字段计算"
    fields:
      - field: title_variants
        depends_on: [title]
        method: multi_language_split
      - field: content_kind
        depends_on: [episode, episode_range]
        method: inference
      - field: qualified
        depends_on: [title, episode]
        method: calculation
      - field: confidence
        depends_on: [all_fields]
        method: calculation

# ============================================================================
# 混合策略 (Hybrid Strategy) - 未来与CRF整合
# ============================================================================

hybrid_strategy:
  enabled: false  # 暂时禁用,Phase 3实施
  description: "Go Parser与CRF的混合策略"
  
  merge_strategies:
    title:
      primary: go_parser
      post_process: clean_delimiters
      confidence_threshold: 0.7
    
    title_variants:
      sources:
        - go_parser.aliases
        - crf_parser.multi_language
      merge_method: deduplicate
      confidence_threshold: 0.6
    
    content_kind:
      primary: crf_parser  # CRF更准确
      fallback: go_parser.inference
      confidence_threshold: 0.8
    
    episode:
      primary: go_parser
      fallback: crf_parser
      confidence_threshold: 0.9

# ============================================================================
# 成功指标 (Success Metrics)
# ============================================================================

success_metrics:
  field_independence:
    current: 0.6
    target: 1.0
    description: "字段独立性比例"
  
  config_coverage:
    current: 0.0
    target: 1.0
    description: "配置覆盖率"
  
  new_field_steps:
    current: 5
    target: 2
    description: "新增字段所需步骤数"
  
  rss_matching_accuracy:
    current: 0.84
    target: 0.92
    description: "RSS匹配准确率"
  
  title_cleanliness:
    current: 0.60
    target: 0.95
    description: "Title清洁度(无分隔符残留)"
  
  standardization_consistency:
    current: 0.70
    target: 1.0
    description: "标准化一致性"

# ============================================================================
# 实施计划 (Implementation Plan)
# ============================================================================

implementation:
  phase1:
    name: "配置驱动"
    timeline: "本周"
    tasks:
      - "创建attribute_config.yaml ✅"
      - "实现配置加载器"
      - "重构title字段提取"
      - "重构episode字段提取"
      - "测试RSS匹配准确率"
  
  phase2:
    name: "字段独立化"
    timeline: "1-2周"
    tasks:
      - "每个字段独立提取器"
      - "实现标准化层"
      - "实现验证层"
      - "迁移所有核心字段"
      - "迁移所有技术属性"
  
  phase3:
    name: "混合策略"
    timeline: "1-2月"
    tasks:
      - "实现CRF集成接口"
      - "实现字段级混合策略"
      - "对比测试Go vs CRF vs Hybrid"
      - "全面测试和优化"
