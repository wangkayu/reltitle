  - id: note_to_bit_depth_hi10p
    match:
      note_values_case_insensitive: ["HI10P"]
    promote_to:
      type: bit_depth
      normalized: "10bit"

  - id: note_to_bit_depth_10bit
    match:
      note_values_case_insensitive: ["10BIT"]
    promote_to:
      type: bit_depth
      normalized: "10bit"

  - id: note_to_edition_uhd
    match:
      note_values_case_insensitive: ["UHD"]
    promote_to:
      type: edition
      normalized: UHD

  - id: note_to_edition_uhdrip
    match:
      note_values_case_insensitive: ["UHDRIP"]
    promote_to:
