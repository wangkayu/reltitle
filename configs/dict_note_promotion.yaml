updated_at: "2026-03-06"
description: "Promotion rules from note -> typed attributes"

defaults:
  action: replace_note_type
  source: note_promote_dict
  keep_note_if_promoted: false

rules:
  - id: note_to_source_web
    match:
      note_values_case_insensitive: ["WEB", "WEBRIP", "WEB-RIP", "WEB RIP"]
    promote_to:
      type: source_type
      normalized: WEBRip

  - id: note_to_source_webdl
    match:
      note_values_case_insensitive: ["WEBDL", "WEB-DL", "WEB DL"]
    promote_to:
      type: source_type
      normalized: WEB-DL

  - id: note_to_source_bd
    match:
      note_values_case_insensitive: ["BD", "BDRIP", "BLURAY", "BLU-RAY"]
    promote_to:
      type: source_type
      normalized: BDRip

  - id: note_to_platform
    match:
      note_values_case_insensitive: ["NF", "NETFLIX", "CR", "BAHA", "ABEMA", "UNEXT", "AMZN", "AMAZON", "AT-X", "BS11"]
    promote_to:
      type: platform
      normalized_from_token: true

  - id: note_to_sub_flag_multi
    match:
      note_values_case_insensitive: ["MULTI", "MULTISUB"]
    promote_to:
      type: sub_flag
      normalized: MULTI_SUBS

  - id: note_to_sub_flag_subs
    match:
      note_values_case_insensitive: ["SUBS", "SUB"]
    promote_to:
      type: sub_flag
      normalized: SUBS

  - id: note_to_sub_flag_vost
    match:
      note_values_case_insensitive: ["VOSTFR", "VOSTEN", "VF"]
    promote_to:
      type: sub_flag
      normalized_from_token: true

  - id: note_to_release_status
    match:
      note_values_case_insensitive: ["END", "FIN", "COMPLETE", "FINAL"]
    promote_to:
      type: release_status
      normalized_from_token: true

  - id: note_to_contents_movie
    match:
      note_values_case_insensitive: ["MOVIE"]
    promote_to:
      type: contents
      normalized: MOVIE

  - id: note_to_resolution_1080p
    match:
      note_values_case_insensitive: ["1080P"]
    promote_to:
      type: resolution
      normalized: 1080p

  - id: note_to_content_rating_age_restricted
    match:
      note_values_case_insensitive: ["AGE_RESTRICTED"]
    promote_to:
      type: content_rating
      normalized: AGE_RESTRICTED

  - id: note_to_edition_bdmv
    match:
      note_values_case_insensitive: ["BDMV"]
    promote_to:
      type: edition
      normalized: BDMV

  - id: note_to_edition_dvd_iso
    match:
      note_values_case_insensitive: ["DVD_ISO", "DVDISO"]
    promote_to:
      type: edition
      normalized: DVD_ISO

  - id: note_to_version_rev
    match:
      note_values_case_insensitive: ["REV"]
    promote_to:
      type: version
      normalized: rev

  - id: note_to_hdr
    match:
      note_values_case_insensitive: ["HDR"]
    promote_to:
      type: hdr
      normalized: HDR

  - id: note_to_bit_depth_hi10p
    match:
      note_values_case_insensitive: ["HI10P"]
    promote_to:
      type: bit_depth
      normalized: "10bit"

  - id: note_to_edition_uhd_variants
    match:
      note_values_case_insensitive: ["UHD", "UHDRIP", "UHD_BDRIP"]
    promote_to:
      type: edition
      normalized_from_token: true

  - id: note_to_edition_disc_variants
    match:
      note_values_case_insensitive: ["DVD9", "JDVD", "R2J", "LASER_DISC_BOX", "BD_BOX"]
    promote_to:
      type: edition
      normalized_from_token: true

  - id: note_to_edition_restore_4k_2k
    match:
      note_values_case_insensitive: ["RESTORE_4K_2K_EDITION"]
    promote_to:
      type: edition
      normalized: "RESTORE_4K_2K_EDITION"

  - id: note_to_pack_profile_curated
    match:
      note_values_case_insensitive: ["CURATED_PACK"]
    promote_to:
      type: pack_profile
      normalized: "curated_pack"

note_whitelist:
  # 未命中 promotion 且属于白名单的 note 保留
  - 检索
  - 检索用
  - 招募翻译
  - 招募校对
  - 招募时轴
  - END
  - FIN
  - COMPLETE
  - 新番
