# ============================================================================
# NOTE和NOISE清理策略
# ============================================================================

cleaning_strategy:
  description: "分层清理NOTE和NOISE"
  
  # Phase 1: 模板匹配前的清理
  phase1_pre_template:
    description: "在模板匹配前清理明确的NOISE"
    
    remove:
      - type: "noise"
        confidence: "> 0.9"
        reason: "高置信度的NOISE"
        examples:
          - "【】"  # 空括号
          - "..."   # 省略号
          - "---"   # 分隔线
      
      - type: "tech"
        in_title_area: true
        reason: "Title区域的TECH噪音"
        examples:
          - "1080p in TITLE area"
          - "x264 in TITLE area"
          - "HEVC in TITLE area"
      
      - type: "pure_number"
        not_episode: true
        not_year: true
        reason: "非Episode/Year的纯数字"
      
      - type: "empty_bracket"
        reason: "空括号"
        patterns:
          - "【】"
          - "[]"
          - "()"
          - "「」"
    
    keep:
      - type: "note"
        reason: "保留NOTE,可能是标题的一部分"
      
      - type: "tech"
        not_in_title_area: true
        reason: "非Title区域的TECH保留用于模板匹配"
      
      - type: "episode"
        reason: "保留Episode用于模板匹配"
      
      - type: "group"
        reason: "保留Group用于模板匹配"
  
  # Phase 2: 模板匹配后的清理
  phase2_post_template:
    description: "在模板匹配后清理剩余的NOTE"
    
    remove:
      - type: "note"
        not_in_template_slots: true
        reason: "模板外的NOTE"
      
      - type: "note"
        is_tech_noise: true
        reason: "技术属性的NOTE"
        patterns:
          - "BIG5"
          - "GB"
          - "CHT"
          - "CHS"
          - "MP4"
          - "MKV"
          - "AVI"
      
      - type: "note"
        is_empty_bracket: true
        reason: "空括号"
      
      - type: "note"
        is_pure_number: true
        not_in_title: true
        reason: "非Title中的纯数字NOTE"
    
    keep:
      - type: "note"
        in_title_slot: true
        reason: "Title slot中的NOTE可能是标题的一部分"
      
      - type: "note"
        is_season_marker: true
        reason: "Season标记保留"
        examples:
          - "S01"
          - "S02"
          - "第一季"
      
      - type: "note"
        is_version_marker: true
        reason: "版本标记保留"
        examples:
          - "修正版"
          - "Director's Cut"
          - "Uncut"

# ============================================================================
# Title区域检测规则
# ============================================================================

title_area_detection:
  description: "检测Title所在的区域,用于清理TECH噪音"
  
  rules:
    - name: "between_group_and_episode"
      priority: 100
      start: "after_group"
      end: "before_episode"
      confidence: 0.9
      description: "GROUP和EPISODE之间"
      examples:
        - "[GROUP] TITLE - EP [TECH]"
        - "[GROUP] TITLE EP [TECH]"
    
    - name: "between_group_and_tech"
      priority: 90
      start: "after_group"
      end: "before_tech"
      confidence: 0.7
      description: "GROUP和TECH之间 (无Episode)"
      examples:
        - "[GROUP] TITLE [TECH]"
        - "[GROUP] TITLE S01 [TECH]"
    
    - name: "first_plain_segment"
      priority: 80
      condition:
        - no_group: true
        - has_plain_segment: true
      confidence: 0.6
      description: "第一个plain segment (无GROUP)"
      examples:
        - "TITLE - EP [TECH]"
        - "TITLE EP [TECH]"
    
    - name: "before_episode"
      priority: 70
      condition:
        - has_episode: true
        - no_group: true
      end: "before_episode"
      confidence: 0.7
      description: "Episode之前 (无GROUP)"
      examples:
        - "TITLE - EP [TECH]"
        - "TITLE EP [TECH]"
    
    - name: "before_tech"
      priority: 60
      condition:
        - has_tech: true
        - no_episode: true
        - no_group: true
      end: "before_tech"
      confidence: 0.5
      description: "TECH之前 (无GROUP, 无Episode)"
      examples:
        - "TITLE [TECH]"
        - "TITLE S01 [TECH]"
