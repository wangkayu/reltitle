updated_at: "2025-01-17"
description: "推理规则配置 - Content Type推理和Contents降级规则"

# ============================================================================
# Content Type推理规则 (优先级从高到低)
# ============================================================================

content_type_inference:
  # 优先级1: Movie (最高)
  - name: "movie_by_index"
    priority: 100
    condition:
      has_movie_index: true
      no_episode_range: true
      has_season: false
      has_season_range: false
    result: "MOVIE"
    confidence: 0.95
    description: "有movie_index字段,例如: 劇場版第1部"
  
  - name: "movie_by_sp_kind"
    priority: 95
    condition:
      sp_kind: "MOVIE"
      no_episode_range: true
      has_season: false
      has_season_range: false
    result: "MOVIE"
    confidence: 0.95
    description: "sp_kind为MOVIE"
  
  - name: "movie_by_keyword"
    priority: 90
    condition:
      has_movie_keyword: true
      no_episode_range: true
      has_season: false
      has_season_range: false
    result: "MOVIE"
    confidence: 0.85
    description: "包含Movie关键词"
    keywords:
      - "movie"
      - "themovie"
      - "劇場版"
      - "剧场版"
      - "映画"
      - "eiga"
      - "gekijouban"
      - "大电影"
      - "大電影"

  - name: "movie_by_year_and_tech"
    priority: 85
    condition:
      has_year: true
      has_tech: true
      no_episode: true
      no_episode_range: true
      has_season: false
      has_pack_kind: false
    result: "MOVIE"
    confidence: 0.75
    description: "PT标准电影发布: Title + Year + Tech (无season/episode/range)"

  - name: "movie_by_tech_only"
    priority: 83
    condition:
      has_tech: true
      no_episode: true
      no_episode_range: true
      has_season: false
      has_pack_kind: false
      has_sp_kind: false
      has_movie_index: false
      no_movie_keyword: true
      no_year: true
    result: "MOVIE"
    confidence: 0.6
    description: "弱电影推断: Title + Tech 但缺少episode/season/pack/movie等强信号，按单条资源处理"
  
  # 优先级2: TV Episode
  - name: "tv_ep_by_episode"
    priority: 80
    condition:
      has_episode: true
      no_episode_range: true
      no_movie_keyword: true
    result: "TV_EP"
    confidence: 0.9
    description: "有单集编号,无episode_range,无movie关键词"
  
  # 优先级3: Pack/Batch
  - name: "batch_by_pack_kind"
    priority: 70
    condition:
      has_pack_kind: true
    result: "BATCH"
    confidence: 0.95
    description: "有pack_kind字段"
    pack_keywords:
      - "全集"
      - "合集"
      - "batch"
      - "complete"
      - "修正合集"
      - "完结"
      - "完結"
      - "pack"
      - "collection"
      - "boxset"
      - "box set"
      - "全话"
      - "全話"
      - "bdrip"
      - "bd-rip"
      - "bd rip"
      - "dvdrip"
      - "dvd-rip"
      - "dvd rip"
      - "bdmv"
      - "dvdiso"
      - "dvd iso"
      - "bluray"
      - "blu-ray"
      - "bdremux"
      - "bd remux"
  
  - name: "batch_by_episode_range"
    priority: 65
    condition:
      has_episode_range: true
    result: "BATCH"
    confidence: 0.95
    description: "有episode_range字段,例如: 01-12"

  - name: "batch_by_season_range"
    priority: 63
    condition:
      has_season_range: true
    result: "BATCH"
    confidence: 0.95
    description: "有season_range字段,例如: S1-S2 (多季度/连续季度pack)"
  
  - name: "season_pack"
    priority: 60
    condition:
      has_season: true
      no_episode: true
      has_tech: true
    result: "BATCH"
    confidence: 0.9
    description: "Season Pack: 有Season marker但没有episode number"
    examples:
      - "Clevatess S01 ... 1080p BluRay"
      - "Onmyoji S01 1080p NF WEB-DL"

  - name: "season_pack_no_tech"
    priority: 58
    condition:
      has_season: true
      no_episode: true
      no_episode_range: true
      has_movie_index: false
      no_movie_keyword: true
    result: "BATCH"
    confidence: 0.6
    description: "Season Pack: 有Season marker但没有episode number (tech attrs missing)"

  # 优先级4: Special
  - name: "special_by_sp_kind"
    priority: 50
    condition:
      has_sp_kind: true
    result: "SPECIAL"
    confidence: 0.85
    description: "有sp_kind字段 (SP/OVA/OAD/ONA/EX)"
  
  # 默认: 未知
  - name: "unknown"
    priority: 0
    condition:
      default: true
    result: "UNKNOWN"
    confidence: 0.5
    description: "无法确定Content Type"

# ============================================================================
# Contents降级规则 (优先级降级机制)
# ============================================================================

contents_demotion:
  description: |
    当一个Batch包含多种内容类型时,非主要类型会被降级为Contents
    优先级: Episode/EpisodeRange (最高) > Movie/SP (降级为Contents)
  
  rules:
    - name: "movie_to_contents_by_episode"
      priority: 100
      condition:
        has_episode: true
        has_movie_flag: true
      action:
        demote: "movie_flag"
        to: "contents"
        normalized: "MOVIE"
      description: "有Episode时,MovieFlag降级为Contents"
      examples:
        - input: "[VCB-Studio] Shinka no Mi 01-12+Movie [Ma10p_1080p]"
          before: "episode_range=01-12, movie_flag=Movie"
          after: "episode_range=01-12, contents=[MOVIE]"
    
    - name: "movie_to_contents_by_episode_range"
      priority: 95
      condition:
        has_episode_range: true
        has_movie_flag: true
      action:
        demote: "movie_flag"
        to: "contents"
        normalized: "MOVIE"
      description: "有EpisodeRange时,MovieFlag降级为Contents"
    
    - name: "special_to_contents_by_episode"
      priority: 90
      condition:
        has_episode: true
        has_special_flag: true
      action:
        demote: "special_flag"
        to: "contents"
        normalized: "OVA|OAD|ONA|SP|EX"  # 保留原始类型
      description: "有Episode时,SpecialFlag降级为Contents"
      examples:
        - input: "[VCB-Studio] Shinka no Mi 01-12+OVA [Ma10p_1080p]"
          before: "episode_range=01-12, special_flag=OVA"
          after: "episode_range=01-12, contents=[OVA]"
    
    - name: "special_to_contents_by_episode_range"
      priority: 85
      condition:
        has_episode_range: true
        has_special_flag: true
      action:
        demote: "special_flag"
        to: "contents"
        normalized: "OVA|OAD|ONA|SP|EX"
      description: "有EpisodeRange时,SpecialFlag降级为Contents"
    
    - name: "season_movie_to_contents"
      priority: 80
      condition:
        has_season: true
        no_episode: true
        has_movie_flag: true
      action:
        demote: "movie_flag"
        to: "contents"
        normalized: "MOVIE"
      description: "有Season但无Episode时,MovieFlag降级为Contents"
      examples:
        - input: "Clevatess S01+Movie 1080p BluRay"
          before: "season=S01, movie_flag=Movie"
          after: "season=S01, contents=[MOVIE]"
    
    - name: "season_special_to_contents"
      priority: 75
      condition:
        has_season: true
        no_episode: true
        has_special_flag: true
      action:
        demote: "special_flag"
        to: "contents"
        normalized: "OVA|OAD|ONA|SP|EX"
      description: "有Season但无Episode时,SpecialFlag降级为Contents"
      examples:
        - input: "Onmyoji S01+OVA 1080p NF WEB-DL"
          before: "season=S01, special_flag=OVA"
          after: "season=S01, contents=[OVA]"
  
  exceptions:
    - name: "s00_encoded_episode"
      description: "S00Exx编码的Special不降级"
      condition:
        episode_starts_with: "S00E"
      action: "skip_demotion"
    
    - name: "special_overlaps_episode"
      description: "SpecialFlag与Episode span重叠时不降级"
      condition:
        special_flag_overlaps_episode_span: true
      action: "skip_demotion"

# ============================================================================
# SP Kind推理规则
# ============================================================================

sp_kind_inference:
  description: "识别SP的子类型 (SP/OVA/OAD/ONA/MOVIE/EX)"
  
  rules:
    # 显式标记
    - name: "explicit_sp_marker"
      priority: 100
      pattern: "(?i)^(sp|ova|ov[a-z]?s|oad|ona|ex)(\\d{1,3})?$"
      result: "SP|OVA|OAD|ONA|EX"
      confidence: 0.95
      examples:
        - 'SP01 → SP'
        - 'OVA02 → OVA'
        - 'OAD → OAD'
        - 'ONA01 → ONA'
        - 'EX03 → EX'
    
    # 前缀变体
    - name: "prefix_ova"
      priority: 90
      pattern: "(?i)^ova"
      result: "OVA"
      confidence: 0.9
      examples:
        - 'OVA·祭 → OVA'
        - 'OVA祭 → OVA'
    
    - name: "prefix_oad"
      priority: 85
      pattern: "(?i)^oad"
      result: "OAD"
      confidence: 0.9
    
    - name: "prefix_ona"
      priority: 85
      pattern: "(?i)^ona"
      result: "ONA"
      confidence: 0.9
    
    - name: "prefix_sp"
      priority: 80
      pattern: "(?i)^sp"
      result: "SP"
      confidence: 0.85
    
    - name: "prefix_ex"
      priority: 80
      pattern: "(?i)^ex"
      result: "EX"
      confidence: 0.85
    
    # 嵌入标记
    - name: "embedded_ova"
      priority: 70
      pattern: "(?i)(?:^|[^a-z])ova(?:s)?(?:$|[^a-z])"
      result: "OVA"
      confidence: 0.8
      examples:
        - 'S01+OVAs → OVA'
    
    - name: "embedded_oad"
      priority: 65
      pattern: "(?i)(?:^|[^a-z])oad(?:$|[^a-z])"
      result: "OAD"
      confidence: 0.8
    
    - name: "embedded_ona"
      priority: 65
      pattern: "(?i)(?:^|[^a-z])ona(?:$|[^a-z])"
      result: "ONA"
      confidence: 0.8
    
    - name: "embedded_sp"
      priority: 60
      pattern: "(?i)(?:^|[^a-z])sp(?:$|[^a-z])"
      result: "SP"
      confidence: 0.75
    
    # Movie标记
    - name: "movie_chinese"
      priority: 95
      keywords: ["大电影", "大電影"]
      result: "MOVIE"
      confidence: 0.95
    
    - name: "movie_japanese"
      priority: 95
      keywords: ["映画", "劇場版", "剧场版"]
      result: "MOVIE"
      confidence: 0.95
    
    - name: "movie_english"
      priority: 90
      keywords: ["movie", "themovie"]
      result: "MOVIE"
      confidence: 0.9
    
    - name: "movie_romanji"
      priority: 85
      keywords: ["eiga", "gekijouban"]
      result: "MOVIE"
      confidence: 0.85
    
    # Special关键词
    - name: "special_keyword"
      priority: 70
      keywords: ["special"]
      result: "SP"
      confidence: 0.7

# ============================================================================
# Episode推理规则
# ============================================================================

episode_inference:
  description: "从不同位置和模式推理Episode"
  
  rules:
    - name: "explicit_e_pattern"
      priority: 100
      pattern: "(?i)^e(\\d{1,4})$"
      confidence: 0.95
      description: "显式的E01格式"
      examples:
        - "E01 → \"01\""
        - "E123 → \"123\""
    
    - name: "sxxexx_pattern"
      priority: 95
      pattern: "(?i)^s(\\d{1,2})e(\\d{1,4})$"
      confidence: 0.95
      description: "SxxExx格式"
      examples:
        - "S01E01 → \"01\""
        - "S02E123 → \"123\""
    
    - name: "chinese_episode"
      priority: 90
      pattern: "^第(\\d{1,4})(?:话|集)$"
      confidence: 0.9
      description: "中文集数格式"
      examples:
        - "第01话 → \"01\""
        - "第123集 → \"123\""
    
    - name: "positional_after_title"
      priority: 80
      condition:
        has_title: true
        has_tech: true
      extract_from:
        start: "after_title"
        end: "before_tech"
      pattern: "\\d{1,4}"
      confidence: 0.8
      description: "从Title和Tech之间提取"
    
    - name: "positional_before_tech"
      priority: 70
      condition:
        has_tech: true
      extract_from:
        position: "before_tech"
        lookback: 10
      pattern: "\\d{1,4}"
      confidence: 0.7
      description: "从Tech前面提取"
    
    - name: "template_based"
      priority: 60
      condition:
        has_template: true
        template_has_ep_slot: true
      extract_from:
        slot: "EP"
      confidence: 0.7
      description: "从模板的EP slot提取"

# ============================================================================
# Title推理规则
# ============================================================================

title_inference:
  description: "从不同位置推理Title"
  
  rules:
    - name: "between_group_and_episode"
      priority: 100
      condition:
        has_group: true
        has_episode: true
        no_title: true
      extract_from:
        start: "after_group"
        end: "before_episode"
      post_process:
        - trim_delimiters: " /|｜\\"
        - remove_tech_noise: true
        - standardize_spaces: true
      confidence: 0.9
      description: "从GROUP和EPISODE之间提取"
    
    - name: "between_group_and_tech"
      priority: 90
      condition:
        has_group: true
        has_tech: true
        no_episode: true
        no_title: true
      extract_from:
        start: "after_group"
        end: "before_tech"
      post_process:
        - trim_delimiters: " /|｜\\"
        - remove_tech_noise: true
        - standardize_spaces: true
      confidence: 0.7
      description: "从GROUP和TECH之间提取"
    
    - name: "from_plain_segment"
      priority: 80
      condition:
        has_plain_segment: true
        no_title: true
      extract_from:
        segment_type: "plain"
        filter_by_length: true
        min_length: 2
      confidence: 0.7
      description: "从plain segment提取"
    
    - name: "template_based"
      priority: 70
      condition:
        has_template: true
        template_has_title_slot: true
        no_title: true
      extract_from:
        slot: "TITLE"
      confidence: 0.8
      description: "从模板的TITLE slot提取"

# ============================================================================
# Aliases推理规则
# ============================================================================

aliases_inference:
  description: "从不同来源推理Aliases"
  
  rules:
    # 优先级1: 空格分隔 (中英文混合)
    - name: "space_separated_cjk_latin"
      priority: 100
      condition:
        has_title: true
        title_contains_cjk_and_latin: true
        title_contains_space: true
      split_type: "space_cjk_latin"
      split_by: [" "]
      merge_consecutive_latin: true
      filter:
        min_length: 2
        has_cjk_or_latin: true
        exclude_tech_noise: true
        exclude_pure_number: true
      deduplicate: true
      exclude_main_title: true
      confidence: 0.85
      description: "识别中英文混合的标题,用空格分隔,合并连续的拉丁单词"
      note: "空格是最常见的分隔符,但需要合并连续的拉丁单词"
      examples:
        - input: "一拳超人 ONE PUNCH MAN"
          output:
            title: "一拳超人"
            variants: ["ONE PUNCH MAN"]
        - input: "药屋少女 Kusuriya no Hitorigoto"
          output:
            title: "药屋少女"
            variants: ["Kusuriya no Hitorigoto"]
    
    # 优先级2: 多个连续空格
    - name: "multiple_spaces_split"
      priority: 95
      condition:
        has_title: true
        title_contains_multiple_spaces: true
      split_type: "pattern"
      split_pattern: "\\s{2,}"
      merge_consecutive_latin: true
      filter:
        min_length: 2
        has_cjk_or_latin: true
        exclude_tech_noise: true
      deduplicate: true
      exclude_main_title: true
      confidence: 0.75
      description: "识别多个连续空格作为分隔符"
      examples:
        - input: "一拳超人  ONE PUNCH MAN"
          output:
            title: "一拳超人"
            variants: ["ONE PUNCH MAN"]
    
    # 优先级3: 基本分隔符 (斜杠、竖线、下划线)
    - name: "multi_language_split"
      priority: 90
      condition:
        has_title: true
        title_contains_delimiter: true
      split_type: "simple_delimiter"
      split_by: ["/", "|", "｜", "_"]
      filter:
        min_length: 2
        has_cjk_or_latin: true
        exclude_tech_noise: true
      deduplicate: true
      exclude_main_title: true
      confidence: 0.8
      description: "从Title的分隔符拆分 (斜杠、竖线、下划线)"
      note: "下划线也是常见的分隔符,但容易与空格混淆"
      examples:
        - input: "药屋少女 / Kusuriya no Hitorigoto"
          output:
            title: "药屋少女"
            variants: ["Kusuriya no Hitorigoto"]
        - input: "葬送的芙莉莲 | Frieren"
          output:
            title: "葬送的芙莉莲"
            variants: ["Frieren"]
        - input: "标题1_标题2"
          output:
            title: "标题1"
            variants: ["标题2"]
      
      # 复杂场景: 空格和下划线混合
      complex_cases:
        - input: "标题1 标题2_标题3 标题4"
          problem: "空格会拆分,但下划线应该优先"
          solution: "需要先按下划线拆分,再按空格拆分"
          note: "这是一个难题,需要分层处理"
    
    # 优先级4: 从Container segment提取
    - name: "from_container"
      priority: 80
      condition:
        has_container_segment: true
      extract_from:
        segment_type: "container"
        filter_tech: true
      confidence: 0.7
      description: "从Container segment提取"
    
    # 优先级5: 从Tail segment提取
    - name: "from_tail"
      priority: 70
      condition:
        has_tail_segment: true
      extract_from:
        segment_type: "tail"
        split_by: ["|", "｜", "_"]
      confidence: 0.6
      description: "从Tail segment提取"
    
    # 优先级6: 从括号中的Title blocks提取
    - name: "from_bracket_blocks"
      priority: 60
      condition:
        has_bracket_title_blocks: true
      extract_from:
        segment_type: "bracket"
        filter_tech: true
        filter_group: true
      confidence: 0.6
      description: "从括号中的Title blocks提取"
  
  # 分层拆分策略 (处理复杂场景)
  layered_splitting:
    description: "处理空格和下划线混合的复杂场景"
    note: "先按强分隔符(下划线)拆分,再按弱分隔符(空格)拆分"
    
    priority_order:
      - delimiter: "_"
        priority: 100
        reason: "下划线是明确的分隔符"
      
      - delimiter: "/"
        priority: 95
        reason: "斜杠是明确的分隔符"
      
      - delimiter: "|"
        priority: 95
        reason: "竖线是明确的分隔符"
      
      - delimiter: " "
        priority: 80
        reason: "空格是弱分隔符,需要合并连续的拉丁单词"
    
    example:
      input: "标题1 标题2_标题3 标题4"
      step1: "按下划线拆分: ['标题1 标题2', '标题3 标题4']"
      step2: "按空格拆分: ['标题1', '标题2', '标题3', '标题4']"
      output:
        title: "标题1"
        variants: ["标题2", "标题3", "标题4"]

# ============================================================================
# Alias过滤规则
# ============================================================================

alias_filtering:
  description: "过滤无效的Alias"
  
  rules:
    - name: "min_length"
      min_length: 2
      description: "最小长度2个字符"
    
    - name: "not_tech_noise"
      exclude_patterns:
        # 分辨率
        - "^\\d{3,4}[pP]$"  # 1080p, 720p
        
        # 视频编码
        - "^[Xx]26[45]$"    # x264, x265
        - "^[Hh]26[45]$"    # H264, H265
        - "^HEVC$"
        - "^AVC$"
        
        # 音频编码
        - "^AAC$"
        - "^FLAC$"
        
        # 容器格式
        - "^MP4$"
        - "^MKV$"
        
        # 文字编码 (不是语言,是编码方式)
        - "^BIG5$"          # Big5编码
        - "^GB$"            # GB编码
        
        # 字幕/音频语言标记 (不是标题语言)
        - "^CHT$"           # 繁体中文字幕
        - "^CHS$"           # 简体中文字幕
        - "^ENG$"           # 英文音频/字幕
        - "^JPN$"           # 日文音频/字幕
        - "^KOR$"           # 韩文音频/字幕
        - "^JAP$"           # 日文音频/字幕 (变体)
      description: "排除技术属性噪音 (编码、格式、语言标记等)"
      note: "BIG5/GB是编码方式,ENG/JPN/KOR是音频/字幕语言,都不是标题或别名"
    
    - name: "not_pure_number"
      exclude_pattern: "^\\d+$"
      description: "排除纯数字"
    
    - name: "has_meaningful_content"
      require:
        - or:
            - has_cjk: true
            - has_latin_word: true  # 至少2个字母
      description: "必须包含有意义的内容"
      note: "只能检测字符类型,不能判断语言"

# ============================================================================
# 语言检测规则 (仅用于Alias拆分,不推断语言)
# ============================================================================

language_detection:
  description: "检测文本的字符类型 (用于Alias拆分,不推断语言)"
  note: "仅用于判断是否需要拆分,不能推断别名的语言"
  
  rules:
    - name: "is_cjk"
      pattern: "[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]"
      description: "包含中日韩文字"
      note: "无法区分是中文、日文还是韩文"
    
    - name: "is_latin"
      pattern: "[A-Za-z]"
      description: "包含拉丁字母"
      note: "无法区分是英文、罗马音还是其他"
    
    - name: "is_mixed_cjk_latin"
      condition:
        - has_cjk: true
        - has_latin: true
      description: "中英文混合"
      note: "仅用于判断是否需要按空格拆分"

