# GROUP Whitelist Configuration
# 统一的字幕组白名单,用于识别 HEAD GROUP 和 TAILGROUP
# 
# 核心理念:
# - 白名单是统一的字幕组列表,不区分 HEAD/TAIL
# - 通过位置边界判断是 HEAD GROUP 还是 TAILGROUP:
#   * 在 [GROUP] 中 → HEAD GROUP
#   * 在 TECH 之后,以 - 开头 → TAILGROUP
#
# 格式说明:
# - name: 字幕组名称
# - frequency: 出现频率 (HIGH/MEDIUM/LOW)
# - confidence_boost: 置信度加成 (0.0-0.2)
# - composite: 是否为复合名称 (包含 - 等分隔符)
# - common_positions: 常见位置 (HEAD/TAIL/BOTH)

version: "1.0"
last_updated: "2025-01-17"

# 统一字幕组白名单
# 按出现频率分层,但不区分 HEAD/TAIL
groups:
  # Tier 1: 高频字幕组 (出现 > 100 次)
  - name: "LoliHouse"
    frequency: "HIGH"
    confidence_boost: 0.15
    composite: false
    common_positions: ["HEAD"]
    description: "LoliHouse 字幕组,主要使用 HEAD GROUP 格式"
    
  - name: "ANi"
    frequency: "HIGH"
    confidence_boost: 0.15
    composite: false
    common_positions: ["TAIL", "BOTH"]
    description: "ANi 字幕组,常用 TAILGROUP 格式"
    
  - name: "VARYG"
    frequency: "HIGH"
    confidence_boost: 0.15
    composite: false
    common_positions: ["TAIL"]
    description: "VARYG 字幕组,Scene-style 格式"
    
  - name: "MiNX"
    frequency: "HIGH"
    confidence_boost: 0.15
    composite: false
    common_positions: ["TAIL"]
    description: "MiNX 字幕组"
    
  - name: "Tsundere-Raws"
    frequency: "HIGH"
    confidence_boost: 0.10
    composite: true
    common_positions: ["TAIL"]
    description: "Tsundere-Raws 字幕组,复合名称"
    
  - name: "Lilith-Raws"
    frequency: "HIGH"
    confidence_boost: 0.10
    composite: true
    common_positions: ["TAIL", "HEAD"]
    description: "Lilith-Raws 字幕组,复合名称"
  
  # Tier 2: 中频字幕组 (出现 20-100 次)
  - name: "Erai-raws"
    frequency: "MEDIUM"
    confidence_boost: 0.08
    composite: true
    common_positions: ["TAIL", "BOTH"]
    description: "Erai-raws 字幕组,可能有双 GROUP"
    
  - name: "SubsPlease"
    frequency: "MEDIUM"
    confidence_boost: 0.08
    composite: false
    common_positions: ["HEAD", "BOTH"]
    description: "SubsPlease 字幕组,通常有 HEAD GROUP"
    
  - name: "HorribleSubs"
    frequency: "MEDIUM"
    confidence_boost: 0.05
    composite: true
    common_positions: ["TAIL"]
    description: "HorribleSubs 字幕组 (已停止运营)"
    
  - name: "NC-Raws"
    frequency: "MEDIUM"
    confidence_boost: 0.08
    composite: true
    common_positions: ["TAIL", "HEAD"]
    description: "NC-Raws 字幕组"
    
  - name: "VCB-Studio"
    frequency: "MEDIUM"
    confidence_boost: 0.08
    composite: true
    common_positions: ["HEAD"]
    description: "VCB-Studio 字幕组"

  # Tier 3: 低频但已知的字幕组 (出现 < 20 次)
  - name: "Commie"
    frequency: "LOW"
    confidence_boost: 0.03
    composite: false
    common_positions: ["TAIL"]
    description: "Commie 字幕组"
    
  - name: "FFF"
    frequency: "LOW"
    confidence_boost: 0.03
    composite: false
    common_positions: ["TAIL"]
    description: "FFF 字幕组"
    
  - name: "UTW"
    frequency: "LOW"
