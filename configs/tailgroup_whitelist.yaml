    description: "Nekomoe kissaten 字幕组"

# 复合后缀模式
# 用于识别 [Prefix]-[Suffix] 格式的字幕组名称
composite_suffixes:
  - "-Raws"      # 如 Tsundere-Raws, Lilith-Raws, NC-Raws
  - "-Subs"      # 如 Horrible-Subs
  - "-raws"      # 小写变体
  - "-subs"      # 小写变体
  - "-Studio"    # 如 VCB-Studio
  - "-studio"    # 小写变体
  - "Fansub"     # 如 XXXFansub
  - "Subs"       # 如 XXXSubs
  - "Raws"       # 如 XXXRaws

# 位置检测规则
# 根据位置边界判断是 HEAD GROUP 还是 TAILGROUP
position_detection:
  # HEAD GROUP 检测规则
  head_group:
    # 规则 1: 在方括号中 [GROUP]
    bracket_enclosed:
      enabled: true
      pattern: "\\[([A-Za-z0-9][A-Za-z0-9\\-]*)\\]"
      priority: 1
      description: "匹配 [LoliHouse], [ANi], [Lilith-Raws] 等格式"
    
    # 规则 2: 在标题开头,后跟空格
    title_prefix:
      enabled: true
      pattern: "^([A-Za-z][A-Za-z0-9\\-]+)\\s+"
      priority: 2
      description: "匹配标题开头的 GROUP (较少见)"
      requires_whitelist: true
  
  # TAILGROUP 检测规则
  tail_group:
    # 规则 1: TECH 之后,以 - 开头
    dash_prefix:
      enabled: true
      pattern: "-([A-Za-z][A-Za-z0-9]*(?:-[A-Za-z][A-Za-z0-9]*)*)"
      priority: 1
      description: "匹配 -ANi, -VARYG, -Tsundere-Raws 等格式"
      position_constraint: "after_tech"
    
    # 规则 2: TECH 之后,白名单匹配 (无 - 前缀)
    whitelist_match:
      enabled: true
      priority: 2
      description: "从白名单中匹配,即使没有 - 前缀"
      position_constraint: "after_tech"
      requires_whitelist: true
    
    # 规则 3: 在括号后 ]GROUP 或 )GROUP
    after_bracket:
      enabled: true
      pattern: "[\\]\\)]([A-Za-z][A-Za-z0-9\\-]+)"
      priority: 3
      description: "匹配 ]ANi, )VARYG 等格式"
      position_constraint: "after_tech"

# 位置约束
position_constraints:
  # TAILGROUP 必须在 TECH 域之后
  after_tech:
    enabled: true
    description: "TAILGROUP 必须出现在最后一个 TECH 属性之后"
  
  # TAILGROUP 必须在 EP 域之后
  after_ep:
    enabled: true
    description: "TAILGROUP 必须出现在 EP 属性之后"
  
  # TAILGROUP 不能在 HEAD 域中
  not_in_head:
    enabled: true
    description: "TAILGROUP 不能出现在标题开头的 HEAD 域中"
  
  # 最大距离 (从 TECH 结束到 TAILGROUP 开始的字符数)
  max_distance_from_tech:
    value: 50
    description: "TAILGROUP 距离 TECH 结束位置不能超过 50 个字符"

# 黑名单 (不应被识别为 GROUP 的词)
# 这些词可能出现在 GROUP 位置,但不是字幕组名称
blacklist:
  - "END"
  - "FIN"
  - "COMPLETE"
  - "BATCH"
  - "合集"
  - "完结"
  - "V2"
  - "V3"
  - "V4"
  - "REPACK"
  - "PROPER"
  - "FIXED"
  - "CORRECTED"
  - "REMUX"

# 统计信息 (由系统自动更新)
statistics:
  total_groups: 16
  high_frequency: 6
  medium_frequency: 5
  low_frequency: 5
  last_validation: "2025-01-17"
  
# 使用说明
usage_notes: |
  1. 白名单是统一的,不区分 HEAD GROUP 和 TAILGROUP
  2. 通过位置边界判断 GROUP 类型:
     - 在 [GROUP] 中 → HEAD GROUP
     - 在 TECH 之后,以 - 开头 → TAILGROUP
  3. 同一个字幕组可能同时出现在 HEAD 和 TAIL 位置
  4. 复合名称 (如 Tsundere-Raws) 需要特殊处理,不能被拆分
  5. 黑名单用于排除元信息词汇,避免误识别
